<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITHDRAW - GARUDA 88</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-red: #ff0000; --gold: #ffd700; }
        * { box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        .header-top { background: linear-gradient(180deg, #4b0000 0%, #000 100%); padding: 12px 15px; display: flex; align-items: center; border-bottom: 2px solid var(--primary-red); }
        .back-btn { color: #fff; font-size: 20px; margin-right: 15px; text-decoration: none; }
        .header-title { font-family: 'Orbitron', sans-serif; color: var(--primary-red); font-size: 18px; margin: 0; }

        .container { padding: 15px; padding-bottom: 100px; }
        
        .info-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .info-row span:last-child { color: var(--gold); font-weight: bold; }

        .wd-form { background: #0f0f0f; border: 1px solid var(--primary-red); border-radius: 10px; padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 5px; outline: none; }
        
        .btn-submit-wd { width: 100%; background: linear-gradient(180deg, #ff4d4d 0%, var(--primary-red) 100%); border: none; color: #fff; padding: 15px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 2px solid var(--primary-red); display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #fff; text-decoration: none; font-size: 10px; font-weight: bold; }
        .nav-item i { display: block; font-size: 20px; color: var(--primary-red); margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="header-top">
        <a href="lobby.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="header-title">FORM WITHDRAW</h1>
    </div>

    <div class="container">
        <div class="info-box">
            <div class="info-row"><span>User ID</span> <span id="wd-user">...</span></div>
            <div class="info-row"><span>Saldo Aktif</span> <span id="wd-balance">IDR 0</span></div>
        </div>

        <div class="wd-form">
            <div class="input-group">
                <label>Pilih Bank / E-Wallet</label>
                <select id="bank-select">
                    <option value="BCA">BCA</option>
                    <option value="BNI">BNI</option>
                    <option value="BRI">BRI</option>
                    <option value="MANDIRI">MANDIRI</option>
                    <option value="DANA">DANA</option>
                    <option value="OVO">OVO</option>
                </select>
            </div>
            <div class="input-group">
                <label>Nama Rekening (Sesuai ID)</label>
                <input type="text" id="acc-name" readonly>
            </div>
            <div class="input-group">
                <label>Nomor Rekening</label>
                <input type="number" id="acc-number" placeholder="Masukkan nomor rekening">
            </div>
            <div class="input-group">
                <label>Nominal Withdraw (Min: 50.000)</label>
                <input type="number" id="amount-wd" placeholder="Contoh: 50000">
            </div>
            <button class="btn-submit-wd" onclick="prosesWD()">KIRIM PERMINTAAN</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="https://wa.me/628123456789" class="nav-item"><i class="fas fa-comments"></i>LIVE CHAT</a>
        <a href="lobby.html" class="nav-item"><i class="fas fa-home"></i>LOBBY</a>
        <a href="#" onclick="logout()" class="nav-item"><i class="fas fa-sign-out-alt"></i>EXIT</a>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (!session) { window.location.href = "index.html"; }

        document.getElementById('wd-user').innerText = session.username.toUpperCase();
        document.getElementById('wd-balance').innerText = "IDR " + new Intl.NumberFormat('id-ID').format(session.balance);
        document.getElementById('acc-name').value = session.username.toUpperCase();

        function prosesWD() {
            const amount = document.getElementById('amount-wd').value;
            if (amount < 50000) {
                alert("Minimal Withdraw adalah 50.000");
                return;
            }
            if (amount > session.balance) {
                alert("Saldo tidak mencukupi!");
                return;
            }
            alert("Permintaan Withdraw Sedang Diproses!");
            window.location.href = "lobby.html";
        }

        function logout() { 
            localStorage.removeItem('userSession'); 
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
