<script>
    const _SB_URL = "https://sbtrcroononwihparzfk.supabase.co";
    const _SB_KEY = "sb_publishable_ebxfpUwby3RO6LqhyFkU-Q_3AMzoYyn";
    const supabaseClient = supabase.createClient(_SB_URL, _SB_KEY);

    let session = JSON.parse(localStorage.getItem('userSession'));
    if (!session) { window.location.href = "index.html"; }

    // Tampilkan data awal
    document.getElementById('wd-user').innerText = session.username.toUpperCase();
    document.getElementById('wd-balance').innerText = "IDR " + new Intl.NumberFormat('id-ID').format(session.balance);

    // Fitur Titik Otomatis
    const inputWD = document.getElementById('amount-wd');
    inputWD.addEventListener('keyup', function() {
        this.value = formatRupiah(this.value);
    });

    function formatRupiah(angka) {
        let number_string = angka.replace(/[^,\d]/g, '').toString(),
            split = number_string.split(','),
            sisa = split[0].length % 3,
            rupiah = split[0].substr(0, sisa),
            ribuan = split[0].substr(sisa).match(/\d{3}/gi);
        if (ribuan) {
            let separator = sisa ? '.' : '';
            rupiah += separator + ribuan.join('.');
        }
        return rupiah;
    }

    async function fetchMemberBankData() {
        const { data } = await supabaseClient.from('members').select('bank_name, acc_name, acc_number').eq('username', session.username).single();
        if (data) {
            document.getElementById('p-bank').innerText = ": " + (data.bank_name || "-").toUpperCase();
            document.getElementById('p-nama-rek').innerText = ": " + (data.acc_name || "-").toUpperCase();
            document.getElementById('p-no-rek').innerText = ": " + (data.acc_number || "-");
        }
    }
    fetchMemberBankData();

    async function prosesWD() {
        const rawValue = document.getElementById('amount-wd').value;
        // PENTING: Hilangkan titik agar menjadi angka murni (int8) sebelum masuk DB
        const amount = parseInt(rawValue.replace(/\./g, '')); 
        const inputPass = document.getElementById('pass-wd').value;
        const loader = document.getElementById('loader');

        if (!amount || !inputPass) return alert("Harap isi semua kolom!");
        if (amount < 50000) return alert("Minimal Withdraw 50.000!");
        if (amount > session.balance) return alert("Saldo tidak mencukupi!");

        loader.style.display = 'flex';

        try {
            // 1. Verifikasi Password dan Ambil Saldo Terbaru dari Database
            const { data: member, error: memberError } = await supabaseClient
                .from('members')
                .select('password, balance, bank_name, acc_number')
                .eq('username', session.username)
                .single();

            if (memberError || !member) throw new Error("Gagal mengambil data member.");

            if (member.password !== inputPass) {
                alert("PASSWORD SALAH!");
                loader.style.display = 'none';
                return;
            }

            const saldoBaru = member.balance - amount;

            // 2. UPDATE Saldo di Tabel 'members'
            const { error: updateError } = await supabaseClient
                .from('members')
                .update({ balance: saldoBaru })
                .eq('username', session.username);

            if (updateError) throw updateError;

            // 3. INSERT ke Tabel 'transactions' (Sesuai kolom di foto Supabase Bapak)
            const { error: insertError } = await supabaseClient
                .from('transactions')
                .insert([{
                    username: session.username,
                    type: 'WITHDRAW',
                    amount: amount, // Masuk sebagai angka murni
                    bank_target: member.bank_name + " (" + member.acc_number + ")",
                    status: 'PENDING'
                }]);

            if (insertError) console.error("Gagal catat riwayat:", insertError);

            // 4. Update Session di HP agar saldo berubah
            session.balance = saldoBaru;
            localStorage.setItem('userSession', JSON.stringify(session));

            alert("Withdraw Berhasil! Saldo otomatis berkurang.");
            window.location.href = "lobby.html";

        } catch (err) {
            console.error(err);
            alert("Kesalahan: " + err.message);
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
