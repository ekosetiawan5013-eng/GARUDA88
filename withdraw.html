<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITHDRAW - GARUDA 88</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #ff0000; --gold: #ffd700; --dark-bg: #000; --form-bg: #0f0f0f; --input-bg: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
        
        /* HEADER - BRANDING AMAN */
        .header-top { background: linear-gradient(180deg, #4b0000 0%, #000 100%); padding: 12px 15px; display: flex; align-items: center; border-bottom: 2px solid var(--primary-red); position: sticky; top: 0; z-index: 100; }
        .back-btn { color: #fff; font-size: 20px; margin-right: 15px; text-decoration: none; display: flex; align-items: center; }
        .header-title { font-family: 'Orbitron', sans-serif; color: var(--primary-red); font-size: 18px; text-transform: uppercase; }

        .container { padding: 15px; }
        
        /* INFO BOX - BRANDING AMAN */
        .info-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .info-row span:first-child { color: #ccc; }
        .info-row span:last-child { color: var(--gold); font-weight: bold; font-family: 'Segoe UI', sans-serif; }

        /* FORM WD */
        .wd-form { background: var(--form-bg); border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; position: relative; } 
        .input-group label { display: block; font-size: 13px; color: #ccc; margin-bottom: 8px; font-weight: bold; }
        
        /* INPUT DASAR - BRANDING AMAN */
        .input-group input { width: 100%; background: var(--input-bg); border: 2px solid #fff; color: #000; padding: 12px; padding-right: 40px; border-radius: 5px; font-weight: bold; outline: none; font-size: 16px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary-red); }

        /* --- STYLING IKON MATA --- */
        .toggle-password { position: absolute; right: 12px; top: 38px; cursor: pointer; color: #aaa; font-size: 18px; z-index: 10; display: none; transition: 0.2s; }
        .toggle-password:hover { color: #333; }
        #pass-wd + .toggle-password { display: block; }

        /* GARIS PEMBATAS */
        .separator { border-top: 1px dashed #444; margin: 15px 0; }

        /* DETAIL BANK */
        .bank-info-section { font-size: 13px; color: #eee; margin-bottom: 20px; }
        .bank-detail-row { display: grid; grid-template-columns: 120px 10px auto; margin-bottom: 6px; align-items: center; }
        .bank-detail-row span:first-child { color: #ccc; }
        .bank-detail-row span:last-child { font-weight: bold; color: #fff; }

        /* TOMBOL - BRANDING AMAN */
        .btn-submit-wd { width: 100%; background: linear-gradient(180deg, #ff4d4d 0%, var(--primary-red) 100%); border: 1px solid #fff; color: #fff; padding: 15px; border-radius: 5px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; border-radius: 7px; transition: 0.3s; box-shadow: 0 4px 6px rgba(255,0,0,0.2); }
        .btn-submit-wd:active { transform: scale(0.98); box-shadow: 0 2px 4px rgba(255,0,0,0.2); }
        
        /* NAV - BRANDING AMAN */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 2px solid var(--primary-red); display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #fff; text-decoration: none; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .nav-item i { display: block; font-size: 20px; color: var(--primary-red); margin-bottom: 3px; }

        /* LOADER */
        .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="loader" class="loading-overlay"><i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-red);"></i></div>

    <div class="header-top">
        <a href="lobby.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="header-title">WITHDRAW</h1>
    </div>

    <div class="container">
        <div class="info-box">
            <div class="info-row"><span>User ID</span> <span id="wd-user">LOADING...</span></div>
            <div class="info-row"><span>Saldo Aktif</span> <span id="wd-balance">IDR 0</span></div>
        </div>

        <div class="wd-form">
            <div class="input-group">
                <label>Jumlah Penarikan</label>
                <input type="text" id="amount-wd" placeholder="Masukan jumlah..." inputmode="numeric">
            </div>
            <div class="input-group">
                <label>Password Akun</label>
                <input type="password" id="pass-wd" placeholder="Masukan password anda...">
                <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <div class="separator"></div>

            <div class="bank-info-section">
                <div class="bank-detail-row"><span>Nama Bank</span><span>:</span><span id="p-bank">...</span></div>
                <div class="bank-detail-row"><span>Nama Rekening</span><span>:</span><span id="p-nama-rek">...</span></div>
                <div class="bank-detail-row"><span>No Rekening</span><span>:</span><span id="p-no-rek">...</span></div>
            </div>

            <button class="btn-submit-wd" onclick="prosesWD()">KIRIM PERMINTAAN</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="https://direct.lc.chat/19643283/" class="nav-item" target="_blank">
            <i class="fas fa-comments"></i>LIVE CHAT
        </a>
        <a href="lobby.html" class="nav-item"><i class="fas fa-home"></i>LOBBY</a>
        <a href="#" onclick="logout()" class="nav-item"><i class="fas fa-sign-out-alt"></i>EXIT</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _URL = "https://sbtrcroononwihparzfk.supabase.co";
        const _KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidHJjcm9vbm9ud2locGFyemZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNDU5NjQsImV4cCI6MjA5MDgyMTk2NH0.eReJz0D_qHIrCwj0lgjRpdaUHoNd8keVorJIGztRNuU";
        const _sb = supabase.createClient(_URL, _KEY);

        let session = JSON.parse(localStorage.getItem('userSession'));
        if (!session) { window.location.href = "index.html"; }

        document.getElementById('wd-user').innerText = session.username.toUpperCase();
        document.getElementById('wd-balance').innerText = "IDR " + new Intl.NumberFormat('id-ID').format(session.balance);

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('pass-wd');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });

        const inWd = document.getElementById('amount-wd');
        inWd.addEventListener('input', function() {
            let val = this.value.replace(/[^0-9]/g, '');
            this.value = val ? new Intl.NumberFormat('id-ID').format(val) : '';
        });

        async function getBank() {
            try {
                const { data, error } = await _sb.from('members').select('*').eq('username', session.username).single();
                if (data) {
                    document.getElementById('p-bank').innerText = data.bank_name;
                    document.getElementById('p-nama-rek').innerText = data.acc_name;
                    document.getElementById('p-no-rek').innerText = data.acc_number;
                }
            } catch(e) { console.log(e) }
        }
        getBank();

        async function prosesWD() {
            const raw = document.getElementById('amount-wd').value;
            const amt = parseInt(raw.replace(/\./g, ''));
            const pass = passwordInput.value;
            const loader = document.getElementById('loader');

            if(!amt || !pass) return alert("Isi semua kolom!");
            if(amt < 50000) return alert("Minimal WD 50.000!");
            if(amt > session.balance) return alert("Saldo tidak cukup!");

            loader.style.display = 'flex';
            try {
                const { data: user, error } = await _sb.from('members').select('*').eq('username', session.username).single();
                
                if(user && user.password === pass) {
                    const newBal = user.balance - amt;
                    await _sb.from('members').update({ balance: newBal }).eq('username', session.username);
                    await _sb.from('transactions').insert([{
                        username: session.username,
                        type: 'WITHDRAW',
                        amount: amt,
                        amount_text: raw,
                        bank_target: user.bank_name + " (" + user.acc_number + ")",
                        status: 'PENDING'
                    }]);
                    session.balance = newBal;
                    localStorage.setItem('userSession', JSON.stringify(session));
                    alert("Withdraw Berhasil Diproses!.");
                    window.location.href = "lobby.html";
                } else {
                    alert("Password Akun Salah!");
                }
            } catch (e) {
                alert("Gangguan sistem koneksi!");
            } finally {
                loader.style.display = 'none';
            }
        }

        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
